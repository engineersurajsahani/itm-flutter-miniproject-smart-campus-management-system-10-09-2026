name: Build Flutter APK & IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  # ==========================================
  # 1. Android APK Build Job
  # ==========================================
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_campus

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: smart_campus/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 2. iOS IPA Build Job
  # ==========================================
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: smart_campus

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into Installable .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Release-IPA
          path: smart_campus/app-release-unsigned.ipa
          retention-days: 14
